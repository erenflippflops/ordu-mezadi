<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ordu Mezadı</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 450px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
    }

    .screen {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      color: #667eea;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #555;
      font-size: 14px;
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    button:hover:not(:disabled) {
      background: #5568d3;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      opacity: 0.6;
    }

    button.secondary {
      background: #f0f0f0;
      color: #666;
    }

    button.secondary:hover:not(:disabled) {
      background: #e0e0e0;
    }

    .player-list {
      margin: 20px 0;
    }

    .player-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f8f8f8;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .player-name {
      font-weight: 600;
      color: #333;
    }

    .player-status {
      font-size: 12px;
      color: #999;
    }

    .mode-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .mode-btn {
      padding: 12px;
      background: #f8f8f8;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin: 0;
    }

    .mode-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      color: white;
      text-align: center;
    }

    .card-icon {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .card-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-count {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 12px;
    }

    .card-desc {
      font-size: 14px;
      opacity: 0.85;
      line-height: 1.4;
    }

    .timer {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      color: #667eea;
      margin: 16px 0;
    }

    .timer.critical {
      color: #e74c3c;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .bid-info {
      text-align: center;
      margin: 16px 0;
      padding: 12px;
      background: #f8f8f8;
      border-radius: 8px;
    }

    .bid-amount {
      font-size: 24px;
      font-weight: 700;
      color: #667eea;
    }

    .bid-owner {
      font-size: 14px;
      color: #666;
      margin-top: 4px;
    }

    .bid-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 16px 0;
    }

    .bid-btn {
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .player-strip {
      margin: 20px 0;
    }

    .player-card {
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .player-gold {
      font-weight: 700;
      color: #f39c12;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin-top: 8px;
    }

    .slot {
      aspect-ratio: 1;
      background: #f8f8f8;
      border: 2px dashed #ddd;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .slot.filled {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-style: solid;
      border-color: #667eea;
    }

    .event-banner {
      background: #f39c12;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      margin: 16px 0;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        transform: translateY(-10px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .turn-info {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .hidden {
      display: none;
    }

    .result-screen {
      text-align: center;
    }

    .result-title {
      font-size: 32px;
      font-weight: 700;
      color: #667eea;
      margin: 20px 0;
    }

    .ranking {
      margin: 20px 0;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: #f8f8f8;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .rank-pos {
      font-size: 24px;
      font-weight: 700;
      color: #667eea;
      width: 40px;
    }

    .rank-info {
      flex: 1;
      text-align: left;
      margin-left: 12px;
    }

    .rank-name {
      font-weight: 600;
      font-size: 16px;
    }

    .rank-score {
      font-size: 14px;
      color: #666;
      margin-top: 2px;
    }

    .error {
      background: #e74c3c;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin: 12px 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Kurulum Ekranı -->
    <div id="setup-screen" class="screen">
      <h1>🎖️ Ordu Mezadı</h1>
      <p class="subtitle">Tek cihazda deneme modu</p>

      <div class="input-group">
        <label>Oyuncu Sayısı</label>
        <select id="player-count">
          <option value="2">2 Oyuncu</option>
          <option value="3">3 Oyuncu</option>
          <option value="4">4 Oyuncu</option>
        </select>
      </div>

      <div class="input-group">
        <label>Oyun Modu</label>
        <div class="mode-selector" id="mode-selector">
          <button class="mode-btn active" data-mode="klasik">Klasik</button>
          <button class="mode-btn" data-mode="troll">Troll Gecesi</button>
          <button class="mode-btn" data-mode="kor">Kör Mod</button>
          <button class="mode-btn" data-mode="fakir">Fakir Mod</button>
        </div>
      </div>

      <button id="start-btn">Oyunu Başlat</button>
    </div>

    <!-- Açık Artırma Ekranı -->
    <div id="auction-screen" class="screen hidden">
      <div class="turn-info" id="turn-info">Tur 1 / 20 • Klasik</div>

      <div id="event-banner" class="event-banner hidden"></div>

      <div class="card" id="unit-card">
        <div class="card-icon">🎯</div>
        <div class="card-name">Keskin Nişancı</div>
        <div class="card-count">2 adet</div>
        <div class="card-desc">İki kişilik gözcü ve nişancı</div>
      </div>

      <div class="timer" id="timer">15</div>

      <div class="bid-info">
        <div class="bid-amount" id="bid-amount">Henüz teklif yok</div>
        <div class="bid-owner" id="bid-owner"></div>
      </div>

      <div id="current-player" style="text-align: center; margin: 16px 0; font-weight: 600; color: #667eea;">
        Şimdi oynayan: Oyuncu 1
      </div>

      <div class="bid-buttons">
        <button class="bid-btn" id="bid-1">+1</button>
        <button class="bid-btn" id="bid-5">+5</button>
        <button class="bid-btn" id="bid-10">+10</button>
      </div>

      <div class="player-strip" id="player-strip"></div>
    </div>

    <!-- Sonuç Ekranı -->
    <div id="result-screen" class="screen hidden">
      <div class="result-title">🏆 Oyun Bitti!</div>

      <div class="ranking" id="ranking"></div>

      <button id="restart-btn">Yeniden Oyna</button>
    </div>
  </div>

  <script src="demo-bundle.js"></script>
  <script src="demo-ui.js"></script>
</body>
</html>
